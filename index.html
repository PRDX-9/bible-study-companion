<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <title>Bible Study</title>

  <meta name="description" content="A personal study companion that helps excavate the word." />
  <meta name="theme-color" content="#10141f" />

  <!-- iOS home screen behaviour -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Bible Study" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css?v=5" />
</head>
<body>
  <header class="app-header">
    <h1 class="app-title">Bible Study</h1>
    <button class="icon-btn" id="settingsBtn" aria-label="Settings">&#9881;</button>
  </header>

  <main id="main">
    <!-- Notes view -->
    <section class="view" id="view-notes">
      <div class="list" id="notesList"></div>
      <p class="empty" id="notesEmpty">No notes yet. Tap + to capture a thought.</p>
    </section>

    <!-- Passages view -->
    <section class="view hidden" id="view-passages">
      <div class="view-actions">
        <button class="btn ghost" id="passagesWordStudy">Word Study</button>
      </div>
      <div class="list" id="passagesList"></div>
      <p class="empty" id="passagesEmpty">No passages yet. Add one, or tag a note with a passage.</p>
    </section>

    <!-- Word Study view -->
    <section class="view hidden" id="view-study">
      <label class="field">
        <span class="lbl">Word or Strong's number</span>
        <input class="text" id="studyStrongsQuery" placeholder="e.g. H6960, G26, agape" autocapitalize="none" />
      </label>
      <button class="btn primary" id="studyStrongsSearch">Look up word</button>
      <div class="detail-section" id="studyStrongsResults">
        <p class="mini">Search by Strong's number, Greek word, Hebrew word, or transliteration.</p>
      </div>
      <div class="divider"></div>
      <p class="mini">Strong's gives a starting point. Check context before drawing a conclusion.</p>
    </section>
  </main>

  <button class="fab" id="fab" aria-label="Add">+</button>

  <nav class="tabbar">
    <button class="tab active" data-view="notes">
      <span class="tab-label">Notes</span>
    </button>
    <button class="tab" data-view="passages">
      <span class="tab-label">Passages</span>
    </button>
    <button class="tab" data-view="study">
      <span class="tab-label">Word Study</span>
    </button>
  </nav>

  <!-- Sheet host -->
  <div class="sheet-backdrop hidden" id="sheetBackdrop"></div>
  <div class="sheet hidden" id="sheet" role="dialog" aria-modal="true"></div>

  <script src="db.js?v=5"></script>
  <script src="books.js?v=5"></script>
  <script src="strongs.js?v=5"></script>
  <script src="app.js?v=5"></script>
</body>
</html>
